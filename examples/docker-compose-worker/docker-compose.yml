services:
  packwiz-web:
    depends_on:
      postgres:
        condition: service_healthy
    image: ghcr.io/leocov-dev/packwiz-web:latest  # release builds
    #image: packwiz-web:latest  # local development
    # Omitting the --worker flag disables background job processing in this container,
    # reserving it exclusively for handling HTTP web traffic and enqueueing jobs.
    command: ["start", "--migrate"]
    ports:
      - "8080:8080"
    environment:
      - PWW_DATABASE=postgres
      - PWW_PG_HOST=postgres
      - PWW_PG_USER=packwiz
      - PWW_PG_PASSWORD=insecure-db-password
      - PWW_PG_DBNAME=packwiz
      - PWW_SESSION_SECRET=insecure-session-secret
      - PWW_MODE=development
      - PWW_ADMIN_PASSWORD=insecure-admin-pass
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  packwiz-worker:
    depends_on:
      postgres:
        condition: service_healthy
      packwiz-web:
        condition: service_healthy
    image: ghcr.io/leocov-dev/packwiz-web:latest  # release builds
    #image: packwiz-web:latest  # local development
    # Dedicated background job worker container that polls and processes queued tasks.
    command: ["worker"]
    environment:
      - PWW_DATABASE=postgres
      - PWW_PG_HOST=postgres
      - PWW_PG_USER=packwiz
      - PWW_PG_PASSWORD=insecure-db-password
      - PWW_PG_DBNAME=packwiz
      - PWW_SESSION_SECRET=insecure-session-secret
      - PWW_MODE=development
      - PWW_ADMIN_PASSWORD=insecure-admin-pass

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=packwiz
      - POSTGRES_USER=packwiz
      - POSTGRES_PASSWORD=insecure-db-password
      - TZ=Etc/UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packwiz -d packwiz"]
      interval: 2s
      timeout: 3s
      retries: 15
