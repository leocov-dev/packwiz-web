services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=packwiz
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=insecure-db-password
      - TZ=Etc/UTC
    ports:
      - "55432:5432"   # non-default host port to avoid clashing with a local postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d packwiz" ]
      interval: 2s
      timeout: 3s
      retries: 15
